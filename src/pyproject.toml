[project]
name = "finance-helper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore",
    "strands-agents",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
