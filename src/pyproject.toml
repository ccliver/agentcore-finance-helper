[project]
name = "finance-helper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore",
    "strands-agents",
    "click",
    "httpx",
]

[project.scripts]
finance-helper = "cli.main:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
